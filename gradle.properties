# Project-wide Gradle settings.

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 defaults to its built-in Kotlin compilation, which is incompatible with KSP
# (KSP requires the classic org.jetbrains.kotlin.android plugin). This project uses
# KSP for Hilt annotation processing (see ADR-7, 02-ARCHITECTURE.md), so this must
# stay false.
android.builtInKotlin=false

# AGP 9's new DSL (default-on) requires android.builtInKotlin=true, which conflicts
# with the requirement above (KSP needs the classic Kotlin plugin, not built-in
# Kotlin) — org.jetbrains.kotlin.android otherwise fails to apply with "not
# compatible with AGP's 9.0 new DSL". This is a documented temporary bridge
# (removed in AGP 10, mid-2026 per Android's release notes) — revisit once AGP's
# built-in Kotlin mode supports KSP, or once KSP no longer needs the classic plugin.
android.newDsl=false
