name: CI

# Quality gates per 02-ARCHITECTURE.md §9: ktlint + detekt, unit tests, Firestore rules unit
# tests, and Compose UI tests on an emulator (API 34), on every PR into master.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: ktlint + detekt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck detekt

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/build/test-results/**/*.xml"
          retention-days: 7

  build:
    name: Assemble debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug

  # Activates once T-04 lands firebase/firestore.rules and a rules test harness (T-14 writes
  # the actual tests). A no-op green check until then, so CI stays meaningful from T-05 on.
  firestore-rules-tests:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f firebase/firestore.rules ] && [ -f firebase/package.json ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: steps.check.outputs.configured == 'true'
        working-directory: firebase
        run: npm ci
      - if: steps.check.outputs.configured == 'true'
        working-directory: firebase
        run: npm test
      - if: steps.check.outputs.configured != 'true'
        run: echo "No firebase/firestore.rules test harness yet (lands in T-04/T-14) — skipping."

  instrumented-tests:
    name: Compose UI tests (emulator API 34)
    runs-on: macos-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          # macos-latest is an Apple Silicon (arm64) runner — an x86_64 system image would run
          # unaccelerated (or fail outright). arm64-v8a is the image that's actually
          # hardware-accelerated here.
          arch: arm64-v8a
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
